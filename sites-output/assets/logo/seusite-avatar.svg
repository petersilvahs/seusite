<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo Premium -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#18191E" />
      <stop offset="100%" stop-color="#090A0D" />
    </radialGradient>
    
    <!-- Gradiente da Marca SeuSite (Laranja Vivo para Âmbar) -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="60%" stop-color="#FF3D00" />
      <stop offset="100%" stop-color="#E62A00" />
    </linearGradient>

    <!-- Gradiente do Ponto / Spark de Ativação -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#FF3D00" />
    </linearGradient>

    <!-- Brilho Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Circular / Avatar Instagram -->
  <rect width="512" height="512" rx="140" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="4" />

  <!-- Símbolo "S" Geométrico Moderno -->
  <g transform="translate(10, 0)">
    <!-- Curva Superior do S -->
    <path d="M 310 160 
             C 310 135, 290 115, 250 115 
             L 210 115 
             C 170 115, 140 145, 140 185 
             C 140 230, 175 255, 230 270 
             L 270 282 
             C 310 295, 335 315, 335 350 
             C 335 395, 300 425, 245 425 
             L 190 425 
             C 150 425, 130 405, 130 380" 
          fill="none" 
          stroke="url(#primaryGrad)" 
          stroke-width="52" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)" />

    <!-- Spark / Ponto Digital (. do SeuSite) -->
    <circle cx="360" cy="140" r="24" fill="url(#sparkGrad)" />
    <!-- Brilho extra no spark -->
    <circle cx="360" cy="140" r="12" fill="#FFF" opacity="0.6" />
  </g>
</svg>
